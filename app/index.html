<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoalKeeper</title>
<meta name="gk-version" content="1.1">
<script>try{var t=localStorage.getItem('gk-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  @font-face {
    font-family: 'Kalam';
    src: url('fonts/Kalam-Bold.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Patrick Hand';
    src: url('fonts/PatrickHand-Regular.woff2') format('woff2');
    font-weight: 400;
  }

  /* ---------- themes: every color lives here; data-theme on <html> switches the set ---------- */
  :root, :root[data-theme="lavender"] {
    color-scheme: light;
    --accent: #8B5CF6; --accent-rgb: 139,92,246; --accent-2: #ff8fd0;
    --pen: #7a5cd6;
    --ink: #2f2a45; --ink-dim: rgba(47,42,69,0.52); --ink-soft: rgba(64,54,107,0.5);
    --glass: rgba(255,255,255,0.42); --glass-border: rgba(255,255,255,0.78);
    --specular: rgba(255,255,255,0.75); --inset-hl: rgba(255,255,255,0.85);
    --bg-base: linear-gradient(160deg, #dedcff 0%, #d3d3ff 45%, #cdc9ff 100%);
    --bg-a: rgba(255,160,210,0.30); --bg-b: rgba(150,115,255,0.25); --bg-c: rgba(255,140,200,0.18);
    --blob-1: 150,110,255; --blob-2: 255,120,190; --blob-3: 180,110,250;
    --shadow-rgb: 95,70,190;
    --postit-a: #ffe4f2; --postit-b: #ffd2e8; --postit-shadow: rgba(80,55,150,0.38);
    --tick: #ff6fb5; --cbx: rgba(64,54,107,0.75);
    --tally: #40366b; --tally-cross: #ff6b6b; --tally-dim: rgba(64,54,107,0.30);
    --ring-track: rgba(64,54,107,0.15);
    --me-color: #c07a00; --danger: #d6336c;
    --pop-bg: rgba(255,255,255,0.80); --pop-border: rgba(255,255,255,0.95);
    --sheet-bg: rgba(255,255,255,0.68); --sheet-border: rgba(255,255,255,0.95);
    --input-bg: rgba(255,255,255,0.75); --input-border: rgba(64,54,107,0.35);
    --btn-bg: rgba(255,255,255,0.65); --btn-bg-hover: rgba(255,255,255,0.9); --btn-border: rgba(64,54,107,0.40); --btn-shadow: rgba(80,60,160,0.35);
    --row-hover: rgba(255,255,255,0.45); --overlay: rgba(90,75,150,0.30);
    --selection: rgba(var(--accent-rgb),0.35); --placeholder: rgba(47,42,69,0.35);
    --val-emboss: rgba(255,255,255,0.55);
    --window-bg: #d4d4ff;
    --marker-red: #ff4d4d; --pencil: #2d2d2d;
  }
  :root[data-theme="blue"] {
    --accent: #2f7cf6; --accent-rgb: 47,124,246; --accent-2: #5ee1ff;
    --pen: #2a63c9;
    --ink: #1f2a44; --ink-dim: rgba(31,42,68,0.55); --ink-soft: rgba(40,60,110,0.5);
    --bg-base: linear-gradient(160deg, #dbe8ff 0%, #cfe0ff 45%, #c7d9ff 100%);
    --bg-a: rgba(120,200,255,0.30); --bg-b: rgba(80,140,255,0.25); --bg-c: rgba(140,220,255,0.18);
    --blob-1: 90,150,255; --blob-2: 80,210,255; --blob-3: 120,170,255;
    --shadow-rgb: 50,90,190;
    --postit-a: #fff6c9; --postit-b: #ffec9e; --postit-shadow: rgba(50,80,160,0.38);
    --tick: #2f7cf6; --cbx: rgba(40,60,110,0.75);
    --tally: #24365e; --tally-dim: rgba(36,54,94,0.30);
    --ring-track: rgba(40,60,110,0.15);
    --input-border: rgba(40,60,110,0.35); --btn-border: rgba(40,60,110,0.40); --btn-shadow: rgba(50,80,170,0.35);
    --overlay: rgba(60,80,150,0.30); --selection: rgba(47,124,246,0.35); --placeholder: rgba(31,42,68,0.35);
    --window-bg: #d2e0ff;
  }
  :root[data-theme="green"] {
    --accent: #22a06b; --accent-rgb: 34,160,107; --accent-2: #a3f7bf;
    --pen: #1f8a5c;
    --ink: #1f3a2e; --ink-dim: rgba(31,58,46,0.55); --ink-soft: rgba(36,80,58,0.5);
    --bg-base: linear-gradient(160deg, #e0f5ea 0%, #d3efe0 45%, #c9ead7 100%);
    --bg-a: rgba(160,240,190,0.30); --bg-b: rgba(90,200,140,0.25); --bg-c: rgba(200,255,200,0.18);
    --blob-1: 90,200,140; --blob-2: 160,240,190; --blob-3: 120,210,150;
    --shadow-rgb: 40,120,80;
    --postit-a: #fff6c9; --postit-b: #ffec9e; --postit-shadow: rgba(40,110,70,0.38);
    --tick: #22a06b; --cbx: rgba(36,80,58,0.75);
    --tally: #24503a; --tally-dim: rgba(36,80,58,0.30);
    --ring-track: rgba(36,80,58,0.15);
    --me-color: #b8720a;
    --input-border: rgba(36,80,58,0.35); --btn-border: rgba(36,80,58,0.40); --btn-shadow: rgba(40,110,70,0.35);
    --overlay: rgba(50,110,80,0.30); --selection: rgba(34,160,107,0.35); --placeholder: rgba(31,58,46,0.35);
    --window-bg: #d6efe1;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #a78bfa; --accent-rgb: 167,139,250; --accent-2: #f472b6;
    --pen: #c4b5fd;
    --ink: #ece9ff; --ink-dim: rgba(236,233,255,0.55); --ink-soft: rgba(236,233,255,0.45);
    --glass: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.16);
    --specular: rgba(255,255,255,0.18); --inset-hl: rgba(255,255,255,0.10);
    --bg-base: linear-gradient(160deg, #1b1930 0%, #161428 45%, #120f22 100%);
    --bg-a: rgba(244,114,182,0.14); --bg-b: rgba(var(--accent-rgb),0.18); --bg-c: rgba(99,102,241,0.12);
    --blob-1: 139,92,246; --blob-2: 244,114,182; --blob-3: 99,102,241;
    --shadow-rgb: 0,0,0;
    --postit-a: #fde68a; --postit-b: #fcd34d; --postit-shadow: rgba(0,0,0,0.5);
    --tick: #f472b6; --cbx: rgba(236,233,255,0.7);
    --tally: #d8d2ff; --tally-cross: #ff8080; --tally-dim: rgba(216,210,255,0.3);
    --ring-track: rgba(255,255,255,0.12);
    --me-color: #fbbf24; --danger: #ff6b9d;
    --pop-bg: rgba(30,27,50,0.92); --pop-border: rgba(255,255,255,0.14);
    --sheet-bg: rgba(30,27,50,0.86); --sheet-border: rgba(255,255,255,0.14);
    --input-bg: rgba(255,255,255,0.08); --input-border: rgba(255,255,255,0.22);
    --btn-bg: rgba(255,255,255,0.08); --btn-bg-hover: rgba(255,255,255,0.18); --btn-border: rgba(255,255,255,0.25); --btn-shadow: rgba(0,0,0,0.5);
    --row-hover: rgba(255,255,255,0.08); --overlay: rgba(0,0,0,0.45);
    --selection: rgba(167,139,250,0.4); --placeholder: rgba(236,233,255,0.35);
    --val-emboss: rgba(0,0,0,0.4);
    --window-bg: #17152a;
    --marker-red: #ff5c5c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  input, [contenteditable] { -webkit-user-select: text; user-select: text; }
  ::selection { background: var(--selection); }
  input::placeholder { color: var(--placeholder); }

  html, body { height: 100%; overflow: hidden; }

  /* themed scrollbars — global floating lavender pill, inset from edges and corners */
  * { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb),0.35) transparent; }
  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: transparent; margin: 22px 0; } /* stop short of rounded corners */
  ::-webkit-scrollbar-track:horizontal { margin: 0 22px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb),0.22);      /* quiet lavender at rest */
    border: 4px solid transparent;          /* floats off the edge: 14px lane -> 6px pill */
    background-clip: padding-box;
    border-radius: 12px;
    min-height: 36px;
  }
  ::-webkit-scrollbar-thumb:hover  { background: rgba(var(--accent-rgb),0.45); background-clip: padding-box; border: 4px solid transparent; }
  ::-webkit-scrollbar-thumb:active { background: rgba(var(--accent-rgb),0.70); background-clip: padding-box; border: 4px solid transparent; }
  body {
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 82% -10%, var(--bg-a), transparent 60%),
      radial-gradient(900px 650px at -10% 90%, var(--bg-b), transparent 60%),
      radial-gradient(700px 500px at 55% 115%, var(--bg-c), transparent 60%),
      var(--bg-base);
    transition: background .25s;
  }

  /* soft bokeh blobs so the glass has something to blur (radial gradients: soft in every renderer) */
  .blob { position: fixed; border-radius: 50%; opacity: .55; pointer-events: none; }
  .blob.b1 { width: 480px; height: 480px; left: 8%; top: 12%; background: radial-gradient(circle, rgba(var(--blob-1),0.32) 0%, rgba(var(--blob-1),0) 68%); }
  .blob.b2 { width: 400px; height: 400px; right: 10%; top: 46%; background: radial-gradient(circle, rgba(var(--blob-2),0.28) 0%, rgba(var(--blob-2),0) 68%); }
  .blob.b3 { width: 440px; height: 440px; left: 40%; bottom: -14%; background: radial-gradient(circle, rgba(var(--blob-3),0.26) 0%, rgba(var(--blob-3),0) 68%); }

  .board {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 14px 20px 92px; /* bottom strip reserved for the floating dock */
    gap: 14px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: baseline; gap: 12px;
    padding: 8px 4px 0 78px; /* clear the traffic lights */
    flex: 0 0 auto;
  }
  .topbar h1 {
    font-family: 'Kalam', cursive;
    font-size: 34px;
    letter-spacing: 1px;
    text-shadow: 0 2px 14px rgba(var(--accent-rgb),0.35);
  }
  .monthbtn { display: flex; align-items: center; gap: 8px; cursor: pointer; position: relative; }
  .monthbtn:hover #monthCaret { transform: translateY(2px); }
  #monthCaret { transition: transform .12s; }
  .topbar .year { font-size: 18px; color: var(--ink-dim); }

  /* month history popover */
  .monthpop {
    position: absolute; top: 100%; left: 0; z-index: 20;
    min-width: 250px;
    margin-top: 8px;
    background: var(--pop-bg);
    border: 1px solid var(--pop-border);
    border-radius: 20px;
    backdrop-filter: blur(30px) saturate(1.6);
    -webkit-backdrop-filter: blur(30px) saturate(1.6);
    box-shadow: 0 22px 60px rgba(var(--shadow-rgb),0.35), inset 0 1px 0 var(--inset-hl);
    padding: 8px;
  }
  .mprow {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 19px;
    padding: 7px 12px;
    border-radius: 14px;
    cursor: pointer;
  }
  .mprow:hover { background: rgba(var(--accent-rgb),0.16); box-shadow: 0 0 0 1.5px rgba(var(--accent-rgb),0.5); }
  .mprow .mname { font-family: 'Kalam', cursive; font-size: 18px; }
  .mprow .mearn { margin-left: auto; color: var(--pen); font-size: 16px; }
  .mprow.on .mname { color: var(--accent); }

  .viewtag {
    font-size: 15px; color: var(--marker-red);
    border: 2px dashed rgba(255,77,77,0.55);
    border-radius: 140px 10px 120px 12px / 12px 110px 10px 130px;
    padding: 1px 12px;
    transform: rotate(-2deg);
  }
  .backchip {
    font-size: 16px; color: var(--pen);
    padding: 3px 14px;
    background: var(--glass);
    border: 1.5px dashed rgba(var(--accent-rgb),0.55);
    border-radius: 160px 14px 140px 16px / 16px 130px 14px 150px;
    cursor: pointer;
    transform: rotate(1.5deg);
  }
  .backchip:hover { box-shadow: 0 0 14px rgba(var(--accent-rgb),0.45); }
  body.viewing-past .fab, body.viewing-past .bonuschip, body.viewing-past #gearBtn { display: none; }
  .topbar .spacer { flex: 1; }
  .iconbtn {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    cursor: pointer;
    transition: box-shadow .15s, transform .1s;
  }
  .iconbtn:hover { box-shadow: 0 0 0 2px rgba(var(--accent-rgb),0.55), 0 0 22px rgba(var(--accent-rgb),0.45); }
  .iconbtn:active { transform: scale(.93); }
  .iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); }

  /* ---------- grid ---------- */
  .grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 236px minmax(0,1fr) 320px;
    gap: 16px;
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

  .panel {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: 0 18px 46px rgba(var(--shadow-rgb),0.22), inset 0 1px 0 var(--inset-hl);
    animation: floatin .55s cubic-bezier(.2,.9,.3,1.2) backwards;
  }
  /* specular highlight strip */
  .panel::before {
    content: ''; position: absolute; left: 8%; right: 8%; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--specular), transparent);
    pointer-events: none;
  }
  @keyframes floatin {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .panel h2 {
    font-family: 'Kalam', cursive;
    font-size: 17px;
    letter-spacing: .5px;
    color: var(--ink-dim);
    padding: 14px 18px 0;
  }

  /* ---------- ladder ---------- */
  .ladder { flex: 1; min-height: 0; display: flex; flex-direction: column; animation-delay: .05s; }
  /* bottom padding ≥ corner radius + edge fade: content never hard-clips against the rounded corner */
  .ladder-list {
    flex: 1; overflow-y: auto; padding: 8px 14px 30px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 22px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 22px), transparent 100%);
  }
  .lrow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 3px 4px;
    font-size: 19px;
    border-radius: 12px;
  }
  .lrow .who { flex-basis: 100%; padding-left: 32px; margin-top: -4px; font-size: 14px; line-height: 1.15; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow[data-kind] { cursor: pointer; transition: background .12s, box-shadow .15s; }
  .lrow[data-kind]:hover { background: var(--row-hover); box-shadow: 0 0 0 1.5px rgba(var(--accent-rgb),0.55); }
  .lrow .cum { font-family: 'Kalam', cursive; font-size: 18px; }
  .lrow .amt { color: var(--ink-dim); font-size: 14px; margin-left: auto; }
  .lrow.future { opacity: .34; }
  .lrow.future .cum { color: var(--ink-dim); }
  .lrow .flag {
    font-size: 12px; color: var(--accent);
    border: 1.5px dashed rgba(var(--accent-rgb),0.7);
    border-radius: 120px 8px 100px 10px / 10px 90px 8px 110px;
    padding: 0 7px; margin-left: auto;
    transform: rotate(-2deg);
  }
  .lrow.bonusrow { color: var(--pen); font-size: 16px; padding-left: 34px; }
  .cbx { width: 22px; height: 22px; flex: 0 0 22px; }
  .empty-hint { flex: 1; display: grid; place-items: center; opacity: .55; }

  /* ---------- hero ---------- */
  .hero {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-evenly;
    padding: 20px 18px;
    gap: 8px;
    animation-delay: .1s;
  }
  .earned { text-align: center; }
  .earned .word {
    font-family: 'Kalam', cursive; font-size: 20px; color: var(--ink-dim);
    letter-spacing: 2px;
  }
  .earned .word svg { display: block; margin: 2px auto 0; }
  .earned .val {
    font-family: 'Kalam', cursive;
    font-size: 74px; line-height: 1.05;
    text-shadow: 0 0 30px rgba(var(--accent-rgb),0.45), 0 2px 0 var(--val-emboss);
  }
  .earned .sub {
    font-size: 19px; color: var(--pen);
    margin-top: 2px;
    transform: rotate(-1.2deg);
  }
  .earned .sub #collectedVal { font-family: 'Kalam', cursive; font-size: 21px; }
  .earned .sub svg { display: block; margin: 0 auto; }
  .ringwrap { position: relative; width: 172px; height: 172px; flex: 0 0 172px; }
  .ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ringlabel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ringlabel .n { font-family: 'Kalam', cursive; font-size: 52px; line-height: 1; }
  .ringlabel .of { font-size: 16px; color: var(--ink-dim); }

  /* ---------- chart ---------- */
  .chart { flex: 1; min-height: 0; display: flex; flex-direction: column; animation-delay: .15s; overflow: visible; }
  .bars {
    flex: 1; min-height: 0; /* height comes from the panel, never from the bars — breaks the grow-on-render loop */
    display: flex; align-items: flex-end; justify-content: space-evenly;
    padding: 10px 26px 30px;
  }
  .barcol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .barcol .wk { font-family: 'Kalam', cursive; font-size: 14px; color: var(--ink-dim); }
  .cash .bill { animation: billdrop .3s cubic-bezier(.3,1.4,.4,1) backwards; }
  @keyframes billdrop {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- leaderboard ---------- */
  .leader { flex: 1; min-height: 0; display: flex; flex-direction: column; animation-delay: .2s; }
  .leader-list {
    flex: 1; overflow-y: auto; padding: 6px 10px 16px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 14px), transparent 100%);
  }
  .prow {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: 16px;
    cursor: pointer;
    transition: background .12s, box-shadow .15s, transform .1s;
  }
  .prow:hover { background: var(--row-hover); box-shadow: 0 0 0 1.5px rgba(var(--accent-rgb),0.55), 0 0 18px rgba(var(--accent-rgb),0.3); }
  .prow:active { transform: scale(.98); }
  .prow .nm { font-size: 21px; min-width: 66px; flex-shrink: 0; }
  .prow.me .nm { color: var(--me-color); }
  .prow .star { width: 20px; height: 20px; margin-left: -4px; flex-shrink: 0; }
  .prow .twrap { flex: 1; min-width: 0; overflow: hidden; }
  .prow .tally { max-width: 100%; height: auto; display: block; } /* viewBox scales tallies down so the count never leaves view */
  .prow .cnt { font-family: 'Kalam', cursive; font-size: 17px; color: var(--ink-dim); flex-shrink: 0; margin-left: auto; }
  .leader .hint { font-size: 13px; color: var(--ink-dim); text-align: center; padding: 0 0 10px; opacity: .7; }

  /* ---------- goals post-it ---------- */
  .postit {
    flex: 0 0 auto;
    position: relative;
    background: linear-gradient(170deg, var(--postit-a) 0%, var(--postit-b) 100%);
    color: var(--pencil);
    border: 2.5px solid var(--pencil);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    box-shadow: 7px 8px 0 var(--postit-shadow);
    transform: rotate(-1.4deg);
    padding: 20px 18px 14px;
    animation: floatin .55s cubic-bezier(.2,.9,.3,1.2) .25s backwards;
  }
  .postit .tape {
    position: absolute; top: -13px; left: 50%;
    width: 92px; height: 26px;
    transform: translateX(-50%) rotate(2.5deg);
    background: rgba(255,255,255,0.35);
    border-left: 2px dashed rgba(0,0,0,0.12);
    border-right: 2px dashed rgba(0,0,0,0.12);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .postit h2 {
    font-family: 'Kalam', cursive; font-size: 21px; padding: 0 0 6px 2px; color: var(--pencil);
    display: inline-block;
    border-bottom: 3px solid var(--marker-red);
    border-radius: 2px 60px 2px 40px / 30px 2px 50px 2px;
    margin-bottom: 6px;
  }
  .grow {
    display: flex; align-items: center; gap: 9px;
    font-size: 19px; line-height: 1.45;
    padding: 1px 0;
    cursor: pointer;
    position: relative;
  }
  .grow .gtxt { flex: 1; outline: none; border-radius: 4px; position: relative; }
  .grow .gtxt:focus { background: rgba(255,255,255,0.55); }
  .grow.done .gtxt { color: rgba(45,45,45,0.55); }
  .grow.done .gtxt::after {
    content: ''; position: absolute; left: -2px; right: -2px; top: 54%; height: 2.5px;
    background: var(--marker-red);
    border-radius: 50% 30% 60% 40%;
    transform: rotate(-1deg);
  }
  .grow .gchk { width: 24px; height: 24px; flex: 0 0 24px; }
  .grow .del {
    opacity: 0; color: var(--marker-red); font-size: 16px; padding: 0 3px; flex: 0 0 auto;
  }
  .grow:hover .del { opacity: .8; }
  .postit .addgoal {

<script>
'use strict';

/* ---------- persistence bridge (native WKWebView or browser localStorage) ---------- */
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge;
let _loadCb = null;
const _fromB64 = b64 => {
  if (!b64) return null;
  try {
    const txt = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    return JSON.parse(txt);
  } catch (e) { return null; }
};
window.__loadedB64 = (b64, existed, starterB64) => {
  if (_loadCb) _loadCb(_fromB64(b64), !!existed, _fromB64(starterB64));
};
function persist() {
  const json = JSON.stringify(state);
  if (native) native.postMessage({ type: 'save', data: json });
  else localStorage.setItem('goalkeeper', json);
}
function loadState(cb) {
  if (native) { _loadCb = cb; native.postMessage({ type: 'load' }); }
  else {
    const raw = localStorage.getItem('goalkeeper');
    let obj = null;
    try { obj = JSON.parse(raw || 'null'); } catch (e) {}
    cb(obj, raw !== null, null);
  }
}

/* ---------- backup export / import ---------- */
const APP_VERSION = (document.querySelector('meta[name="gk-version"]') || {}).content || '0';
function backupFilename() { const d = new Date(); return `GoalKeeper-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`; }
function exportBackup() {
  const json = JSON.stringify({ app: 'GoalKeeper', version: APP_VERSION, exportedAt: new Date().toISOString(), data: state }, null, 2);
  const name = backupFilename();
  if (native) native.postMessage({ type: 'export', data: json, filename: name });
  else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('💾 Backup downloaded');
  }
}
window.__exportDone = ok => { if (ok) toast('💾 Backup saved'); };
function importBackup() {
  if (native) { native.postMessage({ type: 'import' }); return; }
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return; f.text().then(t => { let o = null; try { o = JSON.parse(t); } catch (e) {} offerImport(o); }); };
  inp.click();
}
window.__importedB64 = b64 => offerImport(_fromB64(b64));
const isNum = v => typeof v === 'number' && isFinite(v);
/* accept the wrapped export or a raw data.json; return a clean state object or null */
function normalizeImport(o) {
  if (o && typeof o === 'object' && o.app === 'GoalKeeper' && o.data && typeof o.data === 'object') o = o.data;
  if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
  if (!Array.isArray(o.deals) || typeof o.month !== 'string' || !/^\d{4}-\d{2}$/.test(o.month)) return null;
  const cleanBoard = b => ({
    month: b.month,
    deals: (b.deals || []).filter(d => d && isNum(d.amt) && isNum(d.comm) && isNum(d.ts)).map(d => { const x = { amt: d.amt, comm: d.comm, ts: d.ts }; if (typeof d.who === 'string' && d.who.trim()) x.who = d.who.trim().slice(0, 40); return x; }),
    bonuses: (Array.isArray(b.bonuses) ? b.bonuses : []).filter(x => x && isNum(x.amt) && isNum(x.ts)).map(x => ({ amt: x.amt, label: String(x.label || ''), ts: x.ts })),
    closers: (Array.isArray(b.closers) ? b.closers : []).filter(c => c && typeof c.name === 'string').map(c => ({ name: c.name, count: isNum(c.count) ? c.count : 0 })),
    goals: (Array.isArray(b.goals) ? b.goals : []).filter(g => g && typeof g.text === 'string').map(g => ({ text: g.text, done: !!g.done })),
    ...(typeof b.rep === 'string' ? { rep: b.rep } : {}), ...(isNum(b.pct) ? { pct: b.pct } : {}),
    ...(isNum(b.minDeals) ? { minDeals: b.minDeals } : {}), ...(isNum(b.goalDeals) ? { goalDeals: b.goalDeals } : {}),
  });
  const out = cleanBoard(o);
  out.history = (Array.isArray(o.history) ? o.history : []).filter(h => h && typeof h.month === 'string' && Array.isArray(h.deals)).map(cleanBoard);
  if (typeof o.rep === 'string' && o.rep.trim()) out.rep = o.rep.trim();
  if (isNum(o.pct)) out.pct = o.pct;
  if (isNum(o.minDeals)) out.minDeals = Math.max(1, Math.round(o.minDeals));
  if (isNum(o.goalDeals)) out.goalDeals = Math.max(out.minDeals || 1, Math.round(o.goalDeals));
  out.theme = THEMES.includes(o.theme) ? o.theme : 'lavender';
  return out;
}
let pendingImport = null;
function offerImport(raw) {
  const o = normalizeImport(raw);
  pendingImport = o;
  closeSheets();
  $('importError').hidden = !!o; $('importGo').style.display = o ? '' : 'none';
  if (!o) { $('importSummary').textContent = ''; $('importError').textContent = "That file isn't a GoalKeeper backup. Nothing was changed."; }
  else $('importSummary').textContent = `Backup: ${monthLabel(o.month)} · ${o.deals.length} deal${o.deals.length === 1 ? '' : 's'} · ${o.history.length} archived month${o.history.length === 1 ? '' : 's'} · ${o.rep || 'Me'}\nThis replaces everything on this board (current: ${state.deals.length} deals, ${state.history.length} archived).`;
  openSheet('importOverlay');
}
function applyImport() {
  if (!pendingImport) return;
  state = Object.assign(DEFAULTS(), freshBoard(), pendingImport);
  pendingImport = null; viewing = null; previewTheme = null;
  rollover(); applyTheme(state.theme); persist(); closeSheets(); renderAll();
  toast('📥 Backup restored');
}

/* ---------- updater hooks (native shell calls these) ---------- */
function checkForUpdates() {
  if (shellHas('update')) native.postMessage({ type: 'checkUpdate' });
  else toast('Updates arrive through the Mac app');
}
window.__updateReady = (ver, notes) => {
  const c = $('updateChip');
  c.textContent = `✨ v${ver} ready — tap to update`; c.title = notes || ''; c.hidden = false;
};
window.__updateStatus = (s, ver) => {
  const msg = s === 'checking' ? 'Checking for updates…' : s === 'uptodate' ? `v${APP_VERSION} is the latest` :
    s === 'needsInstaller' ? `v${ver} needs a fresh install (ask Nathan for the DMG)` : s === 'error' ? 'Couldn’t check for updates' : null;
  if (msg) toast(msg);
};
window.__menu = cmd => { ({ export: exportBackup, import: importBackup, checkUpdate: checkForUpdates })[cmd]?.(); };

/* ---------- shell capabilities (injected by the native shell; absent in a browser or an older shell) ---------- */
const shell = (window.__shell && typeof window.__shell === 'object') ? window.__shell : { version: null, features: [], uiSource: 'browser' };
const shellHas = f => native && Array.isArray(shell.features) && shell.features.includes(f);

/* ---------- themes ---------- */
const THEMES = ['lavender', 'blue', 'green', 'dark'];
let previewTheme = null; // theme shown while the settings sheet is open, before Save
function applyTheme(t) {
  if (!THEMES.includes(t)) t = 'lavender';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gk-theme', t); } catch (e) {}
  if (shellHas('windowBg')) {
    const hex = getComputedStyle(document.documentElement).getPropertyValue('--window-bg').trim();
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (m) native.postMessage({ type: 'windowBg', r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) });
  }
}
function renderSwatches(cur) {
  $('swatches').innerHTML = THEMES.map(t => `<div class="swatch ${t === cur ? 'on' : ''}" data-theme="${t}" title="${t}"></div>`).join('');
}

/* ---------- state ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const currentMonth = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); };
const nextMonth = m => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

function freshBoard() {
  return {
    month: currentMonth(),
    deals: [],    // {amt, comm, ts}
    bonuses: [],  // {amt, label, ts}
    closers: [],  // add your team in Settings
    goals: [
      {text:'16 deals minimum', done:false},
      {text:'18 deals GOAL!!', done:false},
      {text:'Top closer at least once', done:false},
    ],
  };
}
const DEFAULTS = () => ({ rep:'Me', pct:10, minDeals:16, goalDeals:18, history:[], theme:'lavender' });
let state = Object.assign(DEFAULTS(), freshBoard());

/* archive the live board into history and start a fresh one for newMonth (shared by auto + manual) */
function archiveAndReset(newMonth) {
  const snap = {
    month: state.month, deals: state.deals, bonuses: state.bonuses,
    closers: state.closers, goals: state.goals,
    rep: state.rep, pct: state.pct, minDeals: state.minDeals, goalDeals: state.goalDeals, // settings as they were
  };
  state.history.push(snap);
  if (native) native.postMessage({ type: 'archive', month: snap.month, data: JSON.stringify(snap) });
  const goals = state.goals.map(g => ({ text: g.text, done: false }));
  const closers = state.closers.map(c => ({ name: c.name, count: 0 }));
  Object.assign(state, freshBoard(), { month: newMonth, goals, closers });
  persist();
}
/* automatic: only when the calendar has moved PAST the board (never when the board is ahead after a manual close-out) */
function rollover() {
  if (!(state.month < currentMonth())) return false;
  archiveAndReset(currentMonth());
  return true;
}
/* an app left open across the 1st: re-check on focus / visibility / every minute, but never mid-edit */
function rolloverIfIdle() {
  if (document.querySelector('.overlay.show')) return;
  if (viewing !== null) return;
  if (rollover()) renderAll();
}
window.addEventListener('focus', rolloverIfIdle);
document.addEventListener('visibilitychange', () => { if (!document.hidden) rolloverIfIdle(); });
setInterval(rolloverIfIdle, 60 * 1000);

/* ---------- board accessor: live month or an archived snapshot (read-only) ---------- */
let viewing = null; // null = live, otherwise index into state.history
const board = () => viewing === null ? state : state.history[viewing];
// settings as they applied to the viewed board (old snapshots lack them: fall back to today's)
const cfg = () => { const b = board(); return {
  rep: b.rep ?? state.rep, pct: b.pct ?? state.pct,
  minDeals: b.minDeals ?? state.minDeals, goalDeals: b.goalDeals ?? state.goalDeals,
}; };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function num(v) { const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? 0 : n; }
// deterministic hand jitter
function j(seed, range) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return ((x - Math.floor(x)) * 2 - 1) * range; }

const earnedOf = b => b.deals.reduce((s,d) => s + d.comm, 0) + b.bonuses.reduce((s,b2) => s + b2.amt, 0);
const earned = () => earnedOf(board());
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return MONTHS[mo-1] + ' ' + y; };

/* ---------- hand-drawn SVG bits ---------- */
function checkboxSVG(checked, seed) {
  const r = `M3 ${4+j(seed,1.5)} Q ${2+j(seed+1,1)} 2 ${6+j(seed+2,2)} 2.5 L 17 ${2.5+j(seed+3,1)} Q 20 2.5 19.5 6 L ${19.5+j(seed+4,1)} 16 Q 19.7 19.5 16 19.3 L 6 ${19.5+j(seed+5,1)} Q 2.7 19.6 2.8 16 Z`;
  let mark = '';
  if (checked) mark = `<path d="M5.5 ${11+j(seed+6,1)} L 9.5 ${15.5+j(seed+7,1)} L 17 ${4.5+j(seed+8,1)}" class="tk" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg class="cbx" viewBox="0 0 22 22"><path d="${r}" class="cb" stroke-width="1.8" fill="none" stroke-linecap="round"/>${mark}</svg>`;
}
function redCheckSVG(seed) {
  return `<svg class="gchk" viewBox="0 0 24 24">
    <path d="M3.5 ${5+j(seed,1)} Q 2.5 3 7 3.2 L 18 ${3+j(seed+1,.8)} Q 21.5 3 21 7 L ${21+j(seed+2,.8)} 17 Q 21.2 21 17 20.8 L 7 ${21+j(seed+3,.8)} Q 3.2 21.2 3.3 17 Z" stroke="#2d2d2d" stroke-width="2" fill="rgba(255,255,255,0.4)" stroke-linecap="round"/>
    <path class="tick" d="M6 ${12.5+j(seed+4,1)} L 10.5 ${17+j(seed+5,1)} L 19 ${5+j(seed+6,1)}" stroke="#ff4d4d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function emptyCheckSVG(seed) {
  return `<svg class="gchk" viewBox="0 0 24 24">
    <path d="M3.5 ${5+j(seed,1)} Q 2.5 3 7 3.2 L 18 ${3+j(seed+1,.8)} Q 21.5 3 21 7 L ${21+j(seed+2,.8)} 17 Q 21.2 21 17 20.8 L 7 ${21+j(seed+3,.8)} Q 3.2 21.2 3.3 17 Z" stroke="#2d2d2d" stroke-width="2" fill="rgba(255,255,255,0.4)" stroke-linecap="round"/>
  </svg>`;
}
function tallySVG(count, seed) {
  if (count <= 0) return `<svg class="tally" height="30" width="30" viewBox="0 0 30 30"><path d="M6 ${15+j(seed,2)} C 12 ${14+j(seed+1,2)}, 20 ${16+j(seed+2,2)}, 26 15" class="td" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
  const groups = Math.floor(count / 5), rem = count % 5;
  const gw = 34, h = 30;
  const width = groups * gw + (rem ? rem * 7 + 6 : 0) + 4;
  let paths = '';
  let x = 4;
  for (let g = 0; g < groups; g++) {
    for (let i = 0; i < 4; i++) {
      const s = seed + g * 9 + i;
      paths += `<path d="M${x + i*7 + j(s,1.2)} ${5+j(s+1,1.5)} C ${x + i*7 + j(s+2,2)} 12, ${x + i*7 + j(s+3,2)} 18, ${x + i*7 + j(s+4,1.2)} ${25+j(s+5,1.5)}" class="ty" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    }
    const s2 = seed + g * 9 + 44;
    paths += `<path d="M${x - 3 + j(s2,1)} ${22+j(s2+1,2)} C ${x+8} ${16+j(s2+2,2)}, ${x+16} ${12+j(s2+3,2)}, ${x + 25 + j(s2+4,1)} ${7+j(s2+5,2)}" class="tx" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    x += gw;
  }
  for (let i = 0; i < rem; i++) {
    const s = seed + groups * 9 + i + 100;
    paths += `<path d="M${x + i*7 + j(s,1.2)} ${5+j(s+1,1.5)} C ${x + i*7 + j(s+2,2)} 12, ${x + i*7 + j(s+3,2)} 18, ${x + i*7 + j(s+4,1.2)} ${25+j(s+5,1.5)}" class="ty" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg class="tally" height="${h}" width="${width}" viewBox="0 0 ${width} ${h}"></svg>`.replace('</svg>', paths + '</svg>');
}
function starSVG() {
  return `<svg class="star" viewBox="0 0 24 24"><path d="M12 3.2 L14.3 8.9 L20.6 9.3 L15.8 13.3 L17.4 19.4 L12 16 L6.6 19.5 L8.1 13.4 L3.3 9.4 L9.6 8.9 Z" stroke="#d99a00" stroke-width="1.8" fill="rgba(255,200,60,0.35)" stroke-linejoin="round"/></svg>`;
}

/* ---------- toast ---------- */
function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, ms);
}

/* ---------- confetti: no library, canvas only, colors from the active theme ---------- */
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cfCanvas = null, cfCtx = null, cfParts = [], cfRaf = 0, cfLast = 0;
function cfColors() {
  const cs = getComputedStyle(document.documentElement);
  return [cs.getPropertyValue('--accent').trim() || '#8B5CF6', cs.getPropertyValue('--accent-2').trim() || '#ff8fd0', '#f2cf6b', '#ffffff'];
}
function cfSize() {
  const dpr = window.devicePixelRatio || 1;
  cfCanvas.width = Math.round(innerWidth * dpr); cfCanvas.height = Math.round(innerHeight * dpr);
  cfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function confetti({ power = 'small', x, y } = {}) {
  if (!cfCanvas) {
    cfCanvas = document.createElement('canvas'); cfCanvas.id = 'confetti';
    document.body.appendChild(cfCanvas); cfCtx = cfCanvas.getContext('2d');
    window.addEventListener('resize', () => { if (cfCanvas) cfSize(); });
  }
  cfSize();
  const n = power === 'big' ? 180 : power === 'medium' ? 90 : 40;
  const colors = cfColors();
  const cx = x == null ? innerWidth / 2 : x, cy = y == null ? innerHeight * 0.38 : y;
  const spread = power === 'big' ? innerWidth * 0.7 : power === 'medium' ? 160 : 30;
  const kick = power === 'big' ? 15 : power === 'medium' ? 12 : 8;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * kick;
    cfParts.push({
      x: cx + (Math.random() - 0.5) * spread, y: cy + (Math.random() - 0.5) * 20,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (power === 'small' ? 5 : 8),
      w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35,
      color: colors[i % colors.length], circle: Math.random() < 0.18,
      life: 1, decay: (power === 'big' ? 0.0045 : 0.007) + Math.random() * 0.005,
    });
  }
  if (reducedMotion) { cfDraw(); setTimeout(() => { cfParts = []; cfCtx.clearRect(0, 0, innerWidth, innerHeight); }, 1400); return; }
  if (!cfRaf) { cfLast = performance.now(); cfRaf = requestAnimationFrame(cfTick); }
}
function cfDraw() {
  cfCtx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of cfParts) {
    cfCtx.save(); cfCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    cfCtx.translate(p.x, p.y); cfCtx.rotate(p.rot); cfCtx.fillStyle = p.color;
    if (p.circle) { cfCtx.beginPath(); cfCtx.arc(0, 0, p.h / 1.4, 0, Math.PI * 2); cfCtx.fill(); }
    else cfCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1);
    cfCtx.restore();
  }
}
function cfTick(t) {
  const dt = Math.min(2.5, (t - cfLast) / 16.7); cfLast = t;
  if (!document.hidden) {
    for (const p of cfParts) {
      p.vy += 0.28 * dt; p.vx *= Math.pow(0.985, dt); p.vy *= Math.pow(0.992, dt);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
    }
    cfParts = cfParts.filter(p => p.life > 0 && p.y < innerHeight + 30);
    cfDraw();
  }
  if (cfParts.length) cfRaf = requestAnimationFrame(cfTick);
  else { cfRaf = 0; cfCtx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ---------- renders ---------- */
function renderTop() {
  const [y, m] = board().month.split('-').map(Number);
  $('monthName').textContent = MONTHS[m-1];
  $('yearNum').textContent = y;
  $('goalsTitle').textContent = MONTHS[m-1] + ' Goals';
  const past = viewing !== null;
  $('viewTag').hidden = !past;
  $('backChip').hidden = !past;
  document.body.classList.toggle('viewing-past', past);
}

function renderHero() {
  $('earnedVal').textContent = fmt(earned());
  $('collectedVal').textContent = fmt(board().deals.reduce((s, d) => s + d.amt, 0));
  const n = board().deals.length, goal = cfg().goalDeals || 18, min = cfg().minDeals || 16;
  $('dealCount').textContent = n;
  $('dealOf').textContent = '/ ' + goal;
  const R = 72, C = 2 * Math.PI * R;
  const frac = Math.min(1, n / goal);
  const minAng = (min / goal) * 2 * Math.PI;
  const tickX = 86 + Math.cos(minAng) * R, tickY = 86 + Math.sin(minAng) * R;
  const tx2 = 86 + Math.cos(minAng) * (R + 9), ty2 = 86 + Math.sin(minAng) * (R + 9);
  $('ringSvg').innerHTML = `
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="g0"/><stop offset="1" class="g1"/>
      </linearGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <circle cx="86" cy="86" r="${R}" class="rt" stroke-width="10" fill="none"/>
    <line x1="${tickX}" y1="${tickY}" x2="${tx2}" y2="${ty2}" stroke="rgba(255,212,121,0.9)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="86" cy="86" r="${R}" stroke="url(#rg)" stroke-width="10" fill="none" stroke-linecap="round"
      filter="url(#glow)" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"
      style="transition: stroke-dashoffset .6s cubic-bezier(.3,1.2,.4,1)"/>`;
}

function renderLadder() {
  const el = $('ladderList');
  const entries = [
    ...board().deals.map((d, i) => ({ ...d, kind: 'deal', i })),
    ...board().bonuses.map((b, i) => ({ ...b, kind: 'bonus', i })),
  ].sort((a, b) => a.ts - b.ts);

  if (!entries.length) {
    el.innerHTML = `<div class="empty-hint">
      <svg width="120" height="150" viewBox="0 0 120 150">
        <path d="M20 14 C 60 30, 88 62, 96 118" class="es" stroke-width="2.5" fill="none" stroke-dasharray="7 8" stroke-linecap="round"/>
        <path d="M84 106 L 97 122 L 103 102" class="es" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>`;
    return;
  }

  let cum = 0, dealIdx = 0, html = '';
  const { minDeals, goalDeals } = cfg();
  for (const e of entries) {
    cum += e.kind === 'deal' ? e.comm : e.amt;
    if (e.kind === 'deal') {
      dealIdx++;
      let flag = '';
      if (dealIdx === minDeals) flag = '<span class="flag">min!</span>';
      else if (dealIdx === goalDeals) flag = '<span class="flag">GOAL!!</span>';
      else if (dealIdx === Math.ceil(goalDeals / 2)) flag = '<span class="flag">halfway!</span>';
      const who = (e.who || '').trim();
      html += `<div class="lrow" data-kind="deal" data-idx="${e.i}" title="${esc(who ? who + ' · ' : '')}${fmt(e.amt)}">${checkboxSVG(true, dealIdx)}<span class="cum">${fmt(cum)}</span>${flag}${flag ? '' : `<span class="amt">${fmt(e.amt)}</span>`}${who ? `<span class="who">${esc(who)}</span>` : ''}</div>`;
    } else {
      html += `<div class="lrow bonusrow" data-kind="bonus" data-idx="${e.i}">+${fmt(e.amt)} ${esc(e.label || 'bonus')}</div>`;
    }
  }
  for (let i = dealIdx + 1; i <= goalDeals; i++) {
    html += `<div class="lrow future">${checkboxSVG(false, i)}<span class="cum">·····</span></div>`;
  }
  el.innerHTML = html;
  el.scrollTop = 0;
}

function renderLeader() {
  const rows = [
    { name: cfg().rep, count: board().deals.length, me: true },
    ...board().closers.map((c, i) => ({ ...c, idx: i })),
  ].sort((a, b) => b.count - a.count);
  const top = rows[0] && rows[0].count > 0 ? rows[0].count : -1;
  $('leaderList').innerHTML = rows.map(r => `

      <span class="nm">${esc(r.name)}</span>
      ${r.count === top ? starSVG() : ''}
      <span class="twrap">${tallySVG(r.count, (r.me ? 999 : r.idx) * 31 + 7)}</span>
      <span class="cnt">${r.count}</span>
    </div>`).join('');
}

function renderGoals() {

/* hand-drawn 3D cash stack: each bill is an oblique slab (front edge + side sliver),
   the top bill shows its full face in perspective */
function cashStackSVG(v, max, svgH, seed) {
  const W = 96, bw = 56, bh = 10, step = 10, dx = 13, dy = 9, baseX = 9;
  const G = '#2f7d52'; // pencil-green ink
  const baseY = svgH - bh - 9;
  const maxBills = Math.max(3, Math.floor((baseY - 42) / step)); // headroom for top face + label
  const n = v > 0 ? Math.max(1, Math.round((v / max) * maxBills)) : 0;
  let out = '';

  if (n === 0) {
    out = `<rect x="${baseX}" y="${baseY}" width="${bw}" height="${bh}" rx="3"
      fill="none" stroke="rgba(47,125,82,0.35)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
    return `<svg class="cash" width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}">${out}</svg>`;
  }

  // grounding shadow, shifted with the oblique depth
  out += `<ellipse cx="${baseX + bw / 2 + dx / 2}" cy="${baseY + bh + 4.5}" rx="${bw * 0.66}" ry="4.4" fill="rgba(var(--shadow-rgb),0.16)"/>`;

  for (let i = 0; i < n; i++) {
    const top = i === n - 1;
    const strap = (i + 1) % 5 === 0;
    const stick = j(seed + i * 11, 1) > 0.55 ? 6.5 : 0; // the occasional sloppy bill sticking out
    const x = baseX + j(seed + i * 3, 3) + stick;
    const y = baseY - i * step + j(seed + i * 5 + 2, 0.9);
    const fill = top ? '#bdedcd' : (i % 2 ? '#a7e1ba' : '#b2e7c3');
    let g = '';

    // right side face — the slab's depth
    g += `<polygon points="${x + bw},${y} ${x + bw + dx},${y - dy} ${x + bw + dx},${y + bh - dy} ${x + bw},${y + bh}"
      fill="#79bd92" stroke="${G}" stroke-width="1.4" stroke-linejoin="round"/>`;

    // front face — pressed paper edges
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2.5" fill="${fill}" stroke="${G}" stroke-width="1.5"/>`;
    g += `<line x1="${x + 3}" y1="${y + 2}" x2="${x + bw - 3}" y2="${y + 2}" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>`;
    for (let t = 0; t < 3; t++) {
      const tx = x + 9 + t * (bw / 3.2) + j(seed + i * 13 + t, 4);
      g += `<line x1="${tx.toFixed(1)}" y1="${y + 3}" x2="${tx.toFixed(1)}" y2="${y + bh - 2.5}" stroke="rgba(47,125,82,0.28)" stroke-width="1"/>`;
    }

    // currency strap wrapping the bundle (front + side)
    if (strap) {
      g += `<rect x="${x + bw / 2 - 7}" y="${y - 0.8}" width="14" height="${bh + 1.6}" rx="2" fill="#f6efe0" stroke="#b09a5f" stroke-width="1"/>
            <rect x="${x + bw / 2 - 7}" y="${y + bh / 2 - 2.2}" width="14" height="4.4" class="acf" opacity=".65"/>`;
    }

    // top face of the top bill: the full bill in perspective
    if (top) {
      g += `<polygon points="${x},${y} ${x + dx},${y - dy} ${x + bw + dx},${y - dy} ${x + bw},${y}"
        fill="#d3f4de" stroke="${G}" stroke-width="1.5" stroke-linejoin="round"/>`;
      // shapes drawn in flipped local space (u,v) -> (x + u + dx*v/dy, y - v); text drawn
      // separately in screen space with a matching skew so glyphs aren't mirrored
      const k = (dx / dy).toFixed(4);
      g += `<g transform="matrix(1 0 ${k} -1 ${x} ${y})">
        <rect x="2.5" y="1.4" width="${bw - 5}" height="${dy - 2.6}" rx="1.5" fill="none" stroke="${G}" stroke-opacity="0.45" stroke-width="0.8"/>
        <ellipse cx="${bw / 2}" cy="${dy / 2}" rx="8.6" ry="3" fill="rgba(255,255,255,0.45)" stroke="${G}" stroke-width="1.1"/>
        <path d="M11 ${dy / 2} q 2.5 -2 5 0 q 2.5 2 5 0" fill="none" stroke="${G}" stroke-opacity="0.5" stroke-width="0.9"/>
        <path d="M${bw - 21} ${dy / 2} q 2.5 -2 5 0 q 2.5 2 5 0" fill="none" stroke="${G}" stroke-opacity="0.5" stroke-width="0.9"/>
      </g>`;
      const faceText = (u, vv, size, txt, op) =>
        `<text transform="translate(${(x + u + (dx / dy) * vv).toFixed(1)} ${(y - vv + size * 0.36).toFixed(1)}) matrix(1 0 ${-(dx / dy).toFixed(4)} 1 0 0)"
          text-anchor="middle" font-family="Kalam, cursive" font-size="${size}" fill="${G}" fill-opacity="${op}">${txt}</text>`;
      g += faceText(bw / 2, dy / 2, 6.4, '$', 1);
      g += faceText(8, 2.4, 4.6, '100', 0.75);
      g += faceText(bw - 8, dy - 2.4, 4.6, '100', 0.75);
    }

    out += `<g class="bill" style="animation-delay:${i * 26}ms">${g}</g>`;
  }

  // hand-drawn gold coins at the base
  const cy = baseY + bh - 1.5;
  const c1x = baseX - 1 + j(seed + 91, 1.5);
  out += `<ellipse cx="${c1x + 10}" cy="${cy + 3.6}" rx="4.9" ry="1.9" fill="#e5bd54" stroke="#a8842a" stroke-width="1.1"/>
    <ellipse cx="${c1x + 10}" cy="${cy + 2.3}" rx="4.9" ry="1.9" fill="#f2cf6b" stroke="#a8842a" stroke-width="1.1"/>
    <circle cx="${c1x}" cy="${cy}" r="4.7" fill="#f2cf6b" stroke="#a8842a" stroke-width="1.2"/>
    <circle cx="${c1x}" cy="${cy}" r="3.1" fill="none" stroke="#a8842a" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="${c1x}" y="${cy + 2.1}" text-anchor="middle" font-family="Kalam, cursive" font-size="5.6" fill="#8a6a1e">$</text>`;

  // value label above the top face
  const labelY = baseY - (n - 1) * step - dy - 8;
  out += `<text x="${W / 2}" y="${labelY}" text-anchor="middle" font-family="Kalam, cursive" font-size="14" class="pnf">${fmt(v)}</text>`;

  return `<svg class="cash" width="${W}" height="${svgH}" viewBox="0 0 ${W} ${svgH}">${out}</svg>`;
}

function renderChart() {
  const weeks = [0, 0, 0, 0, 0];
  const wk = ts => { const d = new Date(ts).getDate(); return Math.min(4, Math.floor((d - 1) / 7)); };
  board().deals.forEach(d => weeks[wk(d.ts)] += d.comm);
  board().bonuses.forEach(b => weeks[wk(b.ts)] += b.amt);
  const max = Math.max(...weeks, 1);
  const svgH = Math.max(80, ($('barsEl').clientHeight || 180) - 66);
  $('barsEl').innerHTML = weeks.map((v, i) => `
    <div class="barcol">
      ${cashStackSVG(v, max, svgH, i * 97 + 13)}
      <div class="wk">w${i + 1}</div>
    </div>`).join('');
}

function renderAll() { renderTop(); renderHero(); renderLadder(); renderLeader(); renderGoals(); renderChart(); }

/* ---------- sheets ---------- */
function openSheet(id) { $(id).classList.add('show'); const inp = $(id).querySelector('input'); if (inp) setTimeout(() => inp.focus(), 60); }
function closeSheets() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
  if (previewTheme && previewTheme !== state.theme) applyTheme(state.theme); // settings cancelled: undo the live preview
  previewTheme = null;
  setTimeout(rolloverIfIdle, 0); // a month may have ticked over while a sheet was open
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) closeSheets(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });

/* ---------- week picker ---------- */
const weekOf = ts => Math.min(4, Math.floor((new Date(ts).getDate() - 1) / 7));
function tsForWeek(w, prev) {
  if (prev != null && weekOf(prev) === w) return prev; // week unchanged: keep original order
  const [y, m] = state.month.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const day = Math.min([4, 11, 18, 25, 29][w], lastDay); // mid-week anchor
  return new Date(y, m - 1, day, 12).getTime();
}
let selWeek = 0;
const defaultWeek = () => state.month > currentMonth() ? 0 : weekOf(Date.now()); // board ahead of the calendar (manual close-out): start at w1
function renderWeekChips(elId) {
  $(elId).innerHTML = [0, 1, 2, 3, 4].map(w =>
    `<div class="wchip ${w === selWeek ? 'on' : ''}" data-w="${w}">w${w + 1}</div>`).join('');
}
['dealWeeks', 'bonusWeeks'].forEach(id => $(id).addEventListener('click', e => {
  const chip = e.target.closest('.wchip'); if (!chip) return;
  selWeek = Number(chip.dataset.w);
  renderWeekChips(id);
}));

/* ---------- month history popover ---------- */
$('monthBtn').addEventListener('click', e => {
  e.stopPropagation();
  const pop = $('monthPop');
  if (!pop.hidden) { pop.hidden = true; return; }
  const rows = [
    { label: monthLabel(state.month), earn: earnedOf(state), idx: null },
    ...state.history.map((h, i) => ({ label: monthLabel(h.month), earn: earnedOf(h), idx: i })).reverse(),
  ];
  pop.innerHTML = rows.map(r => `
    <div class="mprow ${r.idx === viewing ? 'on' : ''}" data-h="${r.idx === null ? '' : r.idx}">
      <span class="mname">${r.label}</span><span class="mearn">${fmt(r.earn)}</span>
    </div>`).join('') + `<div class="mprow closeout" data-closeout>Close out ${monthLabel(state.month).split(' ')[0]} →</div>`;
  pop.hidden = false;
});
$('monthPop').addEventListener('click', e => {
  const row = e.target.closest('.mprow'); if (!row) return;
  e.stopPropagation();
  if (row.hasAttribute('data-closeout')) { $('monthPop').hidden = true; openCloseout(); return; }
  const h = row.getAttribute('data-h');
  viewing = h === '' ? null : Number(h);
  $('monthPop').hidden = true;
  closeSheets();
  renderAll();
});
document.addEventListener('click', () => { $('monthPop').hidden = true; });
$('backChip').addEventListener('click', () => { viewing = null; renderAll(); });

/* ---------- manual close-out ---------- */
function openCloseout() {
  const cur = monthLabel(state.month).split(' ')[0], nxt = monthLabel(nextMonth(state.month)).split(' ')[0];
  $('closeoutTitle').textContent = `Close out ${cur}? 📦`;
  $('closeoutText').textContent = `Archive ${cur} (${state.deals.length} deal${state.deals.length === 1 ? '' : 's'}, ${fmt(earnedOf(state))}) and start ${nxt}? ${cur} stays in the month history, goals reset to unchecked and the leaderboard starts at zero.`;
  closeSheets(); openSheet('closeoutOverlay');
}
$('closeoutBtn').addEventListener('click', openCloseout);
$('closeoutExport').addEventListener('click', () => exportBackup());
$('closeoutGo').addEventListener('click', () => {
  viewing = null;
  const closed = monthLabel(state.month).split(' ')[0];
  archiveAndReset(state.month < currentMonth() ? currentMonth() : nextMonth(state.month));
  closeSheets(); renderAll();
  toast(`📦 ${closed} archived — fresh ${monthLabel(state.month).split(' ')[0]}!`);
});

/* buyer-name autocomplete: distinct names from this month + history, most frequent first */
function renderWhoList() {
  const freq = new Map();
  [state, ...state.history].forEach(b => (b.deals || []).forEach(d => { const w = (d.who || '').trim(); if (w) freq.set(w, (freq.get(w) || 0) + 1); }));
  $('whoList').innerHTML = [...freq.entries()].sort((a, b) => b[1] - a[1]).map(([w]) => `<option value="${esc(w)}">`).join('');
}

/* deal sheet — add & edit */
let commTouched = false;
let amtTouched = false;
let editing = null; // {kind:'deal'|'bonus', idx} or null for add
$('fab').addEventListener('click', () => {
  if (viewing !== null) return;
  editing = null; commTouched = false; amtTouched = false;
  $('dealTitle').textContent = 'Log a deal ✍️';
  $('saveDeal').textContent = 'Close it!';
  $('delDeal').style.display = 'none';
  $('dealAmt').value = ''; $('dealComm').value = ''; $('dealWho').value = ''; renderWhoList();
  $('pctHint').textContent = `(auto ${state.pct}%)`;
  selWeek = defaultWeek(); renderWeekChips('dealWeeks');
  openSheet('dealOverlay');
});
$('dealAmt').addEventListener('input', () => {
  amtTouched = $('dealAmt').value.trim() !== '';
  if (!commTouched) $('dealComm').value = Math.round(num($('dealAmt').value) * state.pct / 100) || '';
});
$('dealComm').addEventListener('input', () => {
  commTouched = $('dealComm').value.trim() !== '';
  // mirror autofill: commission fills in the deal total, unless the total was hand-entered
  if (!amtTouched && state.pct > 0) $('dealAmt').value = Math.round(num($('dealComm').value) * 100 / state.pct) || '';
});
function saveDeal() {
  const amt = num($('dealAmt').value);
  const comm = num($('dealComm').value) || Math.round(amt * state.pct / 100);
  if (amt <= 0 && comm <= 0) return;
  const who = $('dealWho').value.trim().slice(0, 40);
  let celebrate = null;
  if (editing && editing.kind === 'deal') {
    const d = state.deals[editing.idx];
    d.amt = amt; d.comm = comm; d.ts = tsForWeek(selWeek, d.ts);
    if (who) d.who = who; else delete d.who;
  } else {
    const prev = state.deals.length, d = { amt, comm, ts: tsForWeek(selWeek, Date.now()) };
    if (who) d.who = who;
    state.deals.push(d);
    const n = prev + 1;
    if (prev < state.goalDeals && n >= state.goalDeals) celebrate = 'big';
    else if (prev < state.minDeals && n >= state.minDeals) celebrate = 'medium';
  }
  persist(); closeSheets(); renderAll();
  if (celebrate === 'big') { confetti({ power: 'big' }); toast(`🎉 ${state.goalDeals} deals — GOAL!!`); }
  else if (celebrate === 'medium') { confetti({ power: 'medium' }); toast(`✅ ${state.minDeals} deals — minimum hit!`); }
}
$('saveDeal').addEventListener('click', saveDeal);
$('dealOverlay').addEventListener('keydown', e => { if (e.key === 'Enter') saveDeal(); });
$('delDeal').addEventListener('click', () => {
  if (editing && editing.kind === 'deal') state.deals.splice(editing.idx, 1);
  persist(); closeSheets(); renderAll();
});

/* bonus sheet — add & edit */
$('bonusChip').addEventListener('click', () => {
  if (viewing !== null) return;
  editing = null;
  $('bonusTitle').textContent = 'Add a bonus 🎉';
  $('saveBonus').textContent = 'Add';
  $('delBonus').style.display = 'none';
  $('bonusAmt').value = ''; $('bonusLabel').value = '';
  selWeek = defaultWeek(); renderWeekChips('bonusWeeks');
  openSheet('bonusOverlay');
});
function saveBonus() {
  const amt = num($('bonusAmt').value);
  if (amt <= 0) return;
  if (editing && editing.kind === 'bonus') {
    const b = state.bonuses[editing.idx];
    b.amt = amt; b.label = $('bonusLabel').value.trim(); b.ts = tsForWeek(selWeek, b.ts);
  } else {
    state.bonuses.push({ amt, label: $('bonusLabel').value.trim(), ts: tsForWeek(selWeek, Date.now()) });
  }
  persist(); closeSheets(); renderAll();
}
$('saveBonus').addEventListener('click', saveBonus);
$('bonusOverlay').addEventListener('keydown', e => { if (e.key === 'Enter') saveBonus(); });
$('delBonus').addEventListener('click', () => {
  if (editing && editing.kind === 'bonus') state.bonuses.splice(editing.idx, 1);
  persist(); closeSheets(); renderAll();
});

/* ladder: click a logged deal/bonus to edit it (amount, week, delete) */
$('ladderList').addEventListener('click', e => {
  if (viewing !== null) return;
  const row = e.target.closest('.lrow[data-kind]'); if (!row) return;
  const kind = row.dataset.kind, idx = Number(row.dataset.idx);
  editing = { kind, idx };
  if (kind === 'deal') {
    const d = state.deals[idx];
    commTouched = true; amtTouched = true; // don't clobber stored values while editing
    $('dealTitle').textContent = 'Edit deal ✏️';
    $('saveDeal').textContent = 'Save';
    $('delDeal').style.display = '';
    $('dealAmt').value = d.amt || ''; $('dealComm').value = d.comm || ''; $('dealWho').value = d.who || ''; renderWhoList();
    $('pctHint').textContent = `(auto ${state.pct}%)`;
    selWeek = weekOf(d.ts); renderWeekChips('dealWeeks');
    openSheet('dealOverlay');
  } else {
    const b = state.bonuses[idx];
    $('bonusTitle').textContent = 'Edit bonus ✏️';
    $('saveBonus').textContent = 'Save';
    $('delBonus').style.display = '';
    $('bonusAmt').value = b.amt || ''; $('bonusLabel').value = b.label || '';
    selWeek = weekOf(b.ts); renderWeekChips('bonusWeeks');
    openSheet('bonusOverlay');
  }
});

/* settings sheet */
function renderCloserInputs() {
  $('closerList').innerHTML = state.closers.map((c, i) => `
    <div class="closerrow"><input type="text" value="${esc(c.name)}" data-ci="${i}"><span class="x" data-cx="${i}">✕</span></div>`).join('');
}
$('gearBtn').addEventListener('click', () => {
  $('setPct').value = state.pct; $('setName').value = state.rep;
  $('setMin').value = state.minDeals; $('setGoal').value = state.goalDeals;
  renderCloserInputs(); previewTheme = null; renderSwatches(state.theme);
  $('closeoutBtn').textContent = `Close out ${monthLabel(state.month).split(' ')[0]}`;
  $('verLabel').textContent = 'GoalKeeper v' + APP_VERSION + (shell.uiSource === 'appsupport' ? ' (updated)' : '');
  $('shellLabel').textContent = shell.version ? 'shell v' + shell.version : 'browser';
  $('exportBtn').hidden = !(!native || shellHas('export'));
  $('importBtn').hidden = !(!native || shellHas('import'));
  openSheet('setOverlay');
});
$('exportBtn').addEventListener('click', () => exportBackup());
$('importBtn').addEventListener('click', () => importBackup());
$('importGo').addEventListener('click', applyImport);
$('updateChip').addEventListener('click', () => { persist(); if (native) native.postMessage({ type: 'applyUpdate' }); });
$('swatches').addEventListener('click', e => {
  const sw = e.target.closest('.swatch'); if (!sw) return;
  previewTheme = sw.dataset.theme; applyTheme(previewTheme); renderSwatches(previewTheme);
});
$('closerList').addEventListener('click', e => {
  const x = e.target.getAttribute('data-cx');
  if (x !== null) { state.closers.splice(Number(x), 1); renderCloserInputs(); }
});
$('addCloser').addEventListener('click', () => { state.closers.push({ name: '', count: 0 }); renderCloserInputs(); });
$('saveSet').addEventListener('click', () => {
  if (previewTheme) { state.theme = previewTheme; previewTheme = null; }
  state.pct = num($('setPct').value) || state.pct;
  state.rep = $('setName').value.trim() || state.rep;
  state.minDeals = Math.max(1, Math.round(num($('setMin').value)) || state.minDeals);
  state.goalDeals = Math.max(state.minDeals, Math.round(num($('setGoal').value)) || state.goalDeals);
  document.querySelectorAll('#closerList input').forEach(inp => {
    const i = Number(inp.getAttribute('data-ci'));
    if (state.closers[i]) state.closers[i].name = inp.value.trim();
  });
  state.closers = state.closers.filter(c => c.name);
  persist(); closeSheets(); renderAll();
});

/* leaderboard interactions */
$('leaderList').addEventListener('click', e => {
  if (viewing !== null) return;
  const row = e.target.closest('.prow'); if (!row) return;
  const idx = row.getAttribute('data-idx');
  if (idx === 'me') { $('fab').click(); return; }
  state.closers[Number(idx)].count++;
  persist(); renderLeader();
});
$('leaderList').addEventListener('contextmenu', e => {
  const row = e.target.closest('.prow'); if (!row) return;
  e.preventDefault();
  if (viewing !== null) return;
  const idx = row.getAttribute('data-idx');
  if (idx === 'me') {
    if (state.deals.length) { state.deals.pop(); persist(); renderAll(); }
    return;
  }
  const c = state.closers[Number(idx)];
  if (c.count > 0) { c.count--; persist(); renderLeader(); }
});

/* goals interactions */
$('goalsList').addEventListener('click', e => {
  if (viewing !== null) return;
  const row = e.target.closest('.grow'); if (!row) return;
  const i = Number(row.getAttribute('data-i'));
  if (e.target.closest('.del')) { state.goals.splice(i, 1); persist(); renderGoals(); return; }
  if (e.target.closest('.chk')) {
    const nowDone = !state.goals[i].done;
    const r = e.target.closest('.chk').getBoundingClientRect();
    state.goals[i].done = nowDone; persist(); renderGoals();
    if (nowDone) confetti({ power: 'small', x: r.left + r.width / 2, y: r.top + r.height / 2 });
  }
});
$('goalsList').addEventListener('focusout', e => {
  if (viewing !== null) return;
  const txt = e.target.closest('.gtxt'); if (!txt) return;
  const row = txt.closest('.grow'); const i = Number(row.getAttribute('data-i'));
  const v = txt.textContent.trim();
  if (!v) { state.goals.splice(i, 1); renderGoals(); }
  else state.goals[i].text = v;
  persist();
});
$('goalsList').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('.gtxt')) { e.preventDefault(); e.target.blur(); }
});
$('addGoal').addEventListener('click', () => {
  if (viewing !== null) return;
  state.goals.push({ text: 'new goal', done: false });
  persist(); renderGoals();
  const rows = document.querySelectorAll('#goalsList .gtxt');
  const last = rows[rows.length - 1];
  if (last) { last.focus(); document.getSelection().selectAllChildren(last); }
});

window.addEventListener('resize', renderChart);

/* ---------- boot ---------- */
// a board is "pristine" if it has never actually been used — safe to replace with starter data
function boardIsPristine(s) {
  try {
    return (s.deals || []).length === 0 &&
           (s.bonuses || []).length === 0 &&
           (s.history || []).length === 0 &&
           (s.closers || []).every(c => !c.count) &&
           (s.goals || []).every(g => !g.done);
  } catch (e) { return false; }
}

loadState((saved, existed, starter) => {
  const parsed = saved && typeof saved === 'object';
  // starter data only when there is genuinely no data file, or the saved board parsed and was never used.
  // A data file that exists but failed to parse must NEVER be replaced (see the read-only branch below).
  const useStarter = starter && typeof starter === 'object' && ((!existed && !parsed) || (parsed && boardIsPristine(saved)));
  if (useStarter) {
    // this build shipped with a starter board and the local one was never used: adopt it
    state = Object.assign(state, starter);
    if (!Array.isArray(state.history)) state.history = [];
    rollover();
    persist();
  } else if (parsed) {
    state = Object.assign(state, saved);
    if (!Array.isArray(state.history)) state.history = [];
    rollover();
  } else if (!existed) {
    persist(); // genuinely first run, no starter: write the fresh seed
  } else {
    // a data file exists but didn't parse — do NOT overwrite it; data.json.bak holds the previous good version
    console.error('GoalKeeper: data file exists but is unreadable; starting read-only-ish session without persisting the seed.');
  }
  applyTheme(state.theme);
  renderAll();
  if (native) native.postMessage({ type: 'ready' }); // shell: first render succeeded (cancels the updated-UI fallback timer)
});

/* native window drag from the top bar (excluding its interactive controls) */
const inTopbarControls = e => e.target.closest('.monthbtn, .iconbtn, .backchip, .updatechip, .monthpop');
document.querySelector('.topbar').addEventListener('mousedown', e => {
  if (e.button !== 0 || inTopbarControls(e)) return;
  if (native) native.postMessage({ type: 'drag' });
});
document.querySelector('.topbar').addEventListener('dblclick', e => {
  if (inTopbarControls(e)) return;
  if (native) native.postMessage({ type: 'zoomWindow' });
});
</script>
